<div class="circle-wrapper" [class.active]="isFullView" (click)="handleCircleClick()">
  <div class="main-circle">
    <span class="label">{{ t('tab.news') }}</span>
  </div>

  <div
    class="news-panel"
    *ngIf="isFullView"
    (click)="$event.stopPropagation()"
    [style.--news-panel-anchor-bottom.px]="panelAnchorBottom"
  >
    <button type="button" class="panel-close-btn" (pointerdown)="$event.stopPropagation()" (pointerup)="$event.stopPropagation()" (click)="handleClose($event)" [attr.aria-label]="t('panel.closeNews')">✕</button>
    <div *ngIf="news$ | async as newsItems">
      @if (newsItems.length === 0) {
        <p>{{ t('news.empty') }}</p>
      } @else {
        <div class="news-list">
          @for (item of newsItems; track item.id) {
            <article class="news-card" [class.unread]="!item.isRead">
              <h4 class="news-title">{{ item.title }}</h4>
              <p class="news-theme">{{ t('tab.news') }}</p>
              <button type="button" class="read-btn">{{ t('news.markAsRead') }}</button>
            </article>
          }
        </div>
      }
    </div>
  </div>
</div>
