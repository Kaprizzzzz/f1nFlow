<div class="currency-picker" [class.open]="isOpen" (click)="onWrapperClick($event)">
  <button
    type="button"
    class="currency-hex selected"
    (click)="toggle()"
    [attr.aria-expanded]="isOpen"
    aria-label="Choose currency"
  >
    {{ selectedCurrency }}
  </button>
  <div class="pair-preview">{{ selectedCurrency }} → {{ selectedTargetCurrency }}</div>

  <div class="options-panel" [class.visible]="isOpen">
    <button
      *ngFor="let currency of secondaryCurrencies"
      type="button"
      class="currency-hex option"
      [class.active]="selectedTargetCurrency === currency"
      (click)="pick(currency)"
    >
      <span>{{ currency }}</span>
      <small>1 {{ selectedCurrency }} = {{ getRateLabel(currency) }} {{ currency }}</small>
    </button>
  </div>
</div>
