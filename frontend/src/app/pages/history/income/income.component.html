<div class="circle-wrapper" [class.active]="isFullView" (click)="handleCircleClick()">
  <div class="main-circle">
    <span class="label">Income</span>
    <span class="value">{{ totalIncome }}</span>
  </div>

  <div class="sub-circles" *ngIf="isFullView" (click)="$event.stopPropagation()">
    <div class="sub-item" *ngFor="let category of categories">
      <button type="button" class="category-btn" (click)="selectCategory(category, $event)">{{ category }}</button>
      <div class="row-actions">
        <button type="button" class="icon-btn" (click)="startEdit(category, $event)">✏️</button>
        <button type="button" class="icon-btn danger" (click)="deleteCategory(category, $event)">🗑️</button>
      </div>
    </div>

    <div class="edit-row" *ngIf="editModeCategory">
      <input type="text" [(ngModel)]="editedCategoryName" placeholder="New category name" />
      <button type="button" class="small-btn" (click)="saveEdit($event)">Save</button>
      <button type="button" class="small-btn ghost" (click)="cancelEdit($event)">Cancel</button>
    </div>

    <div class="add-row">
      <input type="text" [(ngModel)]="newCategoryName" placeholder="Add new income category" />
      <button type="button" class="small-btn" (click)="addCategory($event)">Add</button>
    </div>
  </div>
</div>

 <div class="modal-overlay" *ngIf="isModalOpen" (click)="isModalOpen = false">
   <div class="modal-card" (click)="$event.stopPropagation()">
    <h3>Add income: {{ selectedCategory }}</h3>
    <input type="number" [(ngModel)]="amount" placeholder="0.00" inputmode="decimal" />
     <button type="button" class="save-btn" (click)="saveData()">Save</button>
  </div>
 </div>
