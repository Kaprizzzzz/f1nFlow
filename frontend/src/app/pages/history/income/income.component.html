<div class="circle-wrapper" [class.active]="isFullView" (click)="handleCircleClick()">
  <div class="main-circle">
    <span class="label">Income</span>
  </div>

  <div class="sub-circles" *ngIf="isFullView">
    <div class="sub-item" (click)="addIncome(500, 'Salary')">💼</div>
    <div class="sub-item" (click)="addIncome(1000, 'Motherlode')">💎</div>
    <div class="sub-item" (click)="openCustomModal()">➕</div>
  </div>
</div>

<div class="full-modal" *ngIf="isModalOpen">
  <div class="header">
    <button class="back-btn" (click)="isModalOpen = false">Back</button>
  </div>
  
  <input type="number" [(ngModel)]="amount" placeholder="0.00">
  
  <button class="save-btn" (click)="saveData()">Save</button>
</div>
