<div class="main-container" [class.dimmed]="activeCategory !== 'none'">
  <div class="user-header" *ngIf="activeCategory === 'none'">
    <span class="name">Hi, {{ userName }}</span>
  </div>

  <div class="circles-layout">
    <app-income 
      [isFullView]="activeCategory === 'income'"
      (onSelect)="setCategory('income')"
      [class.minimized]="activeCategory !== 'none' && activeCategory !== 'income'">
    </app-income>

    <app-expence 
      [isFullView]="activeCategory === 'expense'"
      (onSelect)="setCategory('expense')"
      [class.minimized]="activeCategory !== 'none' && activeCategory !== 'expense'">
    </app-expence>

    <app-saving 
      [isFullView]="activeCategory === 'saving'"
      (onSelect)="setCategory('saving')"
      [class.minimized]="activeCategory !== 'none' && activeCategory !== 'saving'">
    </app-saving>
  </div>

  <button class="back-btn" *ngIf="activeCategory !== 'none'" (click)="activeCategory = 'none'">
    DONE
  </button>
</div>
