<div class="circle-wrapper" [class.active]="isFullView" (click)="handleCircleClick()">
  <div class="main-circle">
    <span class="label">{{ t('tab.news') }}</span>
  </div>

  <div
    class="news-panel"
    *ngIf="isFullView"
    (click)="$event.stopPropagation()"
    [style.--news-panel-anchor-bottom.px]="panelAnchorBottom"
  >
    <button type="button" class="panel-close-btn" (pointerdown)="$event.stopPropagation()" (click)="handleClose($event)" [attr.aria-label]="t('panel.closeNews')">✕</button>
    <div *ngIf="news$ | async as newsItems">
      @if (newsItems.length === 0) {
        <p>{{ t('news.empty') }}</p>
      } @else {
        <ul>
          @for (item of newsItems; track item.id) {
            <li [class.unread]="!item.isRead">{{ item.title }}</li>
          }
        </ul>
      }
    </div>
  </div>
</div>
