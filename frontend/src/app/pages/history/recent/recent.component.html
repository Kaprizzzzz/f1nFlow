<div class="circle-wrapper" [class.active]="isFullView" (click)="handleCircleClick()">
  <div class="main-circle" [style.--quick-ring]="quickRingGradient">
    <span class="label">Recent</span>
  </div>

  <div class="recent-panel" *ngIf="isFullView" (click)="$event.stopPropagation()">
    <div class="quick-limit-row">
      <span>Quick tx count:</span>
      <div class="quick-limit-actions">
        @for (limit of [3,4,5,6,7,8,9,10]; track limit) {
          <button type="button" [class.active]="quickLimit === limit" (click)="setQuickLimit(limit, $event)">{{ limit }}</button>
        }
      </div>
    </div>
    @if (items.length === 0) {
      <p class="recent-empty">No expense stats yet</p>
    } @else {
      @for (item of items; track item.category) {
        <div class="recent-item">
          <div>
            <div class="recent-name">{{ item.category }}</div>
            <div class="recent-meta">{{ item.totalAmount | number:'1.2-2' }} · {{ item.repeatCount }}x</div>
          </div>
          <button type="button" class="repeat-btn" (click)="repeat(item, $event)">↻</button>
        </div>
      }
    }
  </div>
</div>
