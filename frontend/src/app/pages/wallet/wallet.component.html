<section class="wallet-screen">
  <header class="wallet-header">
    <h2>{{ t('tab.wallet') }}</h2>
    <span class="wallet-status" [class.connected]="isConnected">{{ isConnected ? t('status.online') : t('status.offline') }}</span>
  </header>

  <p class="wallet-subtitle">{{ t('wallet.subtitle') }}</p>

  <div class="wallet-grid">
    <article class="wallet-card wallet-card-main">
      <div class="wallet-card-title">{{ t('wallet.connection') }}</div>
      <div class="wallet-card-value">{{ isConnected ? t('wallet.linked') : t('wallet.notLinked') }}</div>
      <button type="button" class="wallet-btn" (click)="toggleConnection()">
        {{ isConnected ? t('wallet.disconnect') : t('wallet.connect') }}
      </button>
      <button type="button" class="wallet-btn wallet-btn-ghost" (click)="connectTelegramWallet()">{{ t('wallet.connectTelegram') }}</button>
      <button type="button" class="wallet-btn wallet-btn-ghost" (click)="openTelegramWalletBot()">Open @wallet</button>
      <p class="wallet-note" *ngIf="telegramWalletId">&#64;{{ telegramWalletId }}</p>
    </article>
  </div>
</section>
