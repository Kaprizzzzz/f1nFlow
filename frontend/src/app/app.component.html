<app-loading *ngIf="showSplash"></app-loading>
 
<div class="app-container" *ngIf="!showSplash">
  <div class="top-controls">
     <div class="top-spacer" aria-hidden="true"></div>
    <div class="user-strip">
      <span>👤 {{ userName }}</span>
    </div>
 
    <app-currency-picker class="currency-slot"></app-currency-picker>
  </div>
 
  <div class="content">
    <router-outlet></router-outlet>
  </div>

  <nav class="bottom-nav">
    <a routerLink="/" routerLinkActive="active" [routerLinkActiveOptions]="{exact: true}">
      <span class="icon">🏠</span>
      <span>Main</span>
    </a>
    <a routerLink="/referrals" routerLinkActive="active">
      <span class="icon">👥</span>
      <span>Referrals</span>
    </a>
    <a routerLink="/about" routerLinkActive="active">
      <span class="icon">ⓘ</span>
      <span>About</span>
    </a>
  </nav>
 </div>
