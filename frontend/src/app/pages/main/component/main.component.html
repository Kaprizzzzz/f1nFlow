<div class="main-container">
  <div class="user-header">
    <div class="user-info">
      <span class="icon">👤</span>
      <span class="name">{{ userName || 'Завантаження...' }}</span>
    </div>
  </div>

  <div class="balance-section">
    <div class="circle outer-circle"></div>
    <div class="circle middle-circle"></div>
    <div class="circle main-circle">
      <span class="label">Total Balance</span>
      <span class="amount">{{ balance | number:'1.2-2' }}</span>
      <span class="currency">F1N</span>
    </div>
  </div>

  <div class="action-section">
    <button class="claim-btn" (click)="onClaim()">
      Claim Rewards
    </button>
  </div>
</div>
