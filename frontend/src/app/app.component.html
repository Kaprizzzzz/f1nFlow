<app-loading *ngIf="showSplash"></app-loading>
 
<div
  class="app-container"
  *ngIf="!showSplash"
  [class.keyboard-open]="isKeyboardOpen"
  (focusin)="onFieldFocusIn()"
  (focusout)="onFieldFocusOut()"
>
  <div class="app-bg-orb one" aria-hidden="true"></div>
  <div class="app-bg-orb two" aria-hidden="true"></div>
  <div class="top-controls">
     <div class="top-spacer" aria-hidden="true"></div>
    <div class="user-strip" aria-label="Telegram user nickname">
      <span class="hex-cap" aria-hidden="true"></span>
      <span class="user-label">{{ userName }}</span>
      <span class="hex-cap" aria-hidden="true"></span>
    </div>
 
    @if (isMainRoute) {
      <app-currency-picker class="currency-slot"></app-currency-picker>
    }
  </div>
 
  <div class="content">
    <router-outlet></router-outlet>
  </div>

  <nav class="bottom-nav">
    <a routerLink="/" routerLinkActive="active" [routerLinkActiveOptions]="{exact: true}">
      <span class="icon">🏠</span>
      <span>Main</span>
    </a>
    <a routerLink="/goals" routerLinkActive="active">
      <span class="icon">🎯</span>
      <span>Goals</span>
    </a>
    <a routerLink="/referrals" routerLinkActive="active">
      <span class="icon">👥</span>
      <span>Referrals</span>
    </a>
    <a routerLink="/about" routerLinkActive="active">
      <span class="icon">ⓘ</span>
      <span>About</span>
    </a>
  </nav>
 </div>
