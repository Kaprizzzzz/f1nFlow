name: CI

on:
  pull_request:
  push:
    branches: [main, master]

jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm config set registry https://registry.npmjs.org/
      - name: Install frontend dependencies (non-blocking)
        continue-on-error: true
        run: npm install --legacy-peer-deps --no-audit --no-fund
      - name: Frontend typecheck (non-blocking)
        continue-on-error: true
        run: npm run typecheck
      - name: Frontend build (non-blocking)
        continue-on-error: true
        run: npm run build:prod
      - name: Frontend CI summary
        run: echo "Frontend pipeline completed (install/typecheck/build are currently non-blocking)."

  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm config set registry https://registry.npmjs.org/
      - name: Install dependencies (non-blocking)
        continue-on-error: true
        run: npm ci --legacy-peer-deps --no-audit --no-fund
      - name: Build backend (non-blocking)
        continue-on-error: true
        run: npm run build
      - name: Backend CI summary
        run: echo "Backend pipeline completed (install/build are currently non-blocking)."
