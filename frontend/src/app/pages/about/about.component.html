<section class="about-screen">
  <header>
    <h2>{{ t("about.title") }}</h2>
    <p>{{ t("about.description") }}</p>
  </header>

  <div class="links-grid">
    <a
      class="tile"
      href="https://t.me"
      target="_blank"
      rel="noopener noreferrer"
      >{{ t("about.telegramChannel") }}</a
    >
    <a
      class="tile"
      href="https://t.me"
      target="_blank"
      rel="noopener noreferrer"
      >{{ t("about.telegramChat") }}</a
    >
    <a
      class="tile"
      href="https://instagram.com"
      target="_blank"
      rel="noopener noreferrer"
      >{{ t("about.instagram") }}</a
    >
    <a
      class="tile"
      href="https://www.tiktok.com"
      target="_blank"
      rel="noopener noreferrer"
      >{{ t("about.tiktok") }}</a
    >
  </div>

  <article class="hint-card">
    <h3>{{ t("about.tip") }}</h3>
    <p>{{ tip }}</p>
  </article>
</section>
