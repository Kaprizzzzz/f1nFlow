<div class="currency-picker" [class.open]="isOpen" (click)="onWrapperClick($event)">
  <button
    type="button"
    class="currency-hex selected"
    (click)="toggle()"
    [attr.aria-expanded]="isOpen"
    aria-label="Choose currency"
  >
    {{ selectedCurrency }}
  </button>

  <div class="options-panel" [class.visible]="isOpen">
    <button
      *ngFor="let currency of currencies"
      type="button"
      class="currency-hex option"
      [class.active]="selectedCurrency === currency"
      (click)="pick(currency)"
    >
      <span>{{ currency }}</span>
    </button>
  </div>
</div>
