<div class="circle-wrapper" [class.active]="isFullView">
    <div class="main-circle" (click)="handleCircleClick()">
      <span class="label">{{ displayLabel }}</span>
      <span class="value">{{ displayValue | number:'1.2-2' }}</span>
    </div>
  
   <div class="sticker-row" *ngIf="isFullView && categories.length" (click)="$event.stopPropagation()">
      <button
        *ngFor="let category of categories; let i = index"
        type="button"
        class="mini-circle"
        [class.selected]="category.name === selectedCategory"
        (click)="selectCategory(category, $event)"
        [ngStyle]="getMiniCircleStyle(i, categories.length)"
        [title]="category.name"
        [attr.data-category-index]="i"
        draggable="true"
        (pointerdown)="onMiniPointerDown(i, $event)"
        (pointermove)="onMiniPointerMove($event)"
        (pointerup)="onMiniPointerUp($event)"
        (pointercancel)="onMiniPointerUp($event)"
        (dragstart)="startDrag(i, $event)"
        (dragover)="allowDrop($event)"
        (drop)="dropOn(i, $event)"
      >
        {{ category.icon || '📁' }}
      </button>
    </div>
  
    <div class="panel" *ngIf="isFullView && showCategoryPanel" (click)="$event.stopPropagation()">
      <div class="selected-card" *ngIf="selectedCategoryData as category">
        <div class="summary">
          <span class="emoji">{{ category.icon || '📁' }}</span>
          <div>
            <div class="name">{{ category.name }}</div>
            <div class="amount">{{ category.amount | number:'1.2-2' }}</div>
          </div>
        </div>
        
        <div class="row-actions">
          <button type="button" class="icon-btn" (click)="toggleAmountPanel(category, $event)">+</button>
          <button type="button" class="icon-btn" (click)="openEditName(category, $event)">✏️</button>
          <button type="button" class="icon-btn danger" (click)="deleteCategory(category.name, $event)">🗑️</button>
        </div>
      </div>

      <div class="edit-row" *ngIf="editModeCategory && panelMode === 'name'">
        <input type="text" [(ngModel)]="editedCategoryName" placeholder="New category name" />
        <button type="button" class="small-btn" (click)="saveEdit($event)">Save</button>
        <button type="button" class="small-btn ghost" (click)="cancelEdit($event)">Cancel</button>
      </div>

      <div class="add-row" *ngIf="!selectedCategoryData">
         <input type="text" [(ngModel)]="newCategoryName" placeholder="Create category" />
        <select [(ngModel)]="newCategoryIcon" aria-label="Category icon">
          <option *ngFor="let icon of emojiOptions" [ngValue]="icon">{{ icon }}</option>
        </select>
        <button type="button" class="small-btn" (click)="addCategory($event)">Save</button>
      </div>
    </div>

     <div class="amount-modal-backdrop" *ngIf="selectedCategoryData && panelMode === 'amount'" (click)="closeAmountPanel()">
      <div class="amount-modal" (click)="$event.stopPropagation()">
        <div class="amount-modal-title">{{ selectedCategoryData?.name }}</div>
        <input type="number" [(ngModel)]="amount" placeholder="0.00" inputmode="decimal" min="0.01" step="0.01" />
        <div class="amount-modal-actions">
          <button type="button" class="small-btn ghost" (click)="closeAmountPanel($event)">Cancel</button>
          <button type="button" class="small-btn" (click)="saveData()">Save</button>
        </div>
      </div>
    </div>
    
 </div>
