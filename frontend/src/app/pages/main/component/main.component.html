 <div class="dashboard-container" [class.has-active]="activeTab !== null" (click)="closeActiveTab()">
   <div class="layout-controls">
    <button
      type="button"
      class="edit-hex"
      [class.active]="isEditMode"
      (click)="toggleEditMode()"
      [attr.aria-pressed]="isEditMode"
      aria-label="Toggle edit mode"
    >
      ✎
    </button>

    @if (isEditMode) {
      <div class="edit-actions" aria-label="Edit actions">
        <button type="button" class="action-hex option visible" (click)="saveLayout()" aria-label="Save layout">💾</button>
        <button type="button" class="action-hex option visible secondary" (click)="resetToDefaultLayout()" aria-label="Reset layout">↺</button>
      </div>
    }
    </div>
   <div
     #layoutRef
     class="circles-layout"
     [class.editing]="isEditMode"
     (pointermove)="onDragMove($event)"
     (pointerup)="stopDrag()"
     (pointercancel)="stopDrag()"
     (pointerleave)="stopDrag()"
     (click)="$event.stopPropagation(); closeActiveTab()"
   >
     <div
      #sphereRef
       class="sphere-wrapper"
      data-tab="income"
       [class.is-active]="activeTab === 'income'"
       [class.is-hidden]="isHidden('income')"
       [ngStyle]="getSphereStyle('income')"
       (pointerdown)="onDragStart($event, 'income')"
       (click)="$event.stopPropagation()"
     >
       <app-income
         [isFullView]="activeTab === 'income'"
         [showCategoryPanel]="activeTab === 'income' || activeTab === 'expense'"
         (onSelect)="setActiveTab('income')"
       ></app-income>
      </div>
  
     <div
      #sphereRef
       class="sphere-wrapper"
      data-tab="expense"
       [class.is-active]="activeTab === 'expense'"
       [class.is-hidden]="isHidden('expense')"
       [ngStyle]="getSphereStyle('expense')"
       (pointerdown)="onDragStart($event, 'expense')"
       (click)="$event.stopPropagation()"
     >
       <app-expence
         [isFullView]="activeTab === 'expense'"
         [showCategoryPanel]="activeTab === 'income' || activeTab === 'expense'"
         (onSelect)="setActiveTab('expense')"
       ></app-expence>
      </div>
  
     <div
      #sphereRef
       class="sphere-wrapper"
      data-tab="saving"
       [class.is-active]="activeTab === 'saving'"
       [class.is-hidden]="isHidden('saving')"
       [ngStyle]="getSphereStyle('saving')"
       (pointerdown)="onDragStart($event, 'saving')"
       (click)="$event.stopPropagation()"
     >
       <app-saving
         [isFullView]="activeTab === 'saving'"
         (onSelect)="setActiveTab('saving')"
       ></app-saving>
       </div>
     <div
      #sphereRef
       class="sphere-wrapper"
      data-tab="news"
       [class.is-active]="activeTab === 'news'"
       [class.is-hidden]="isHidden('news')"
       [ngStyle]="getSphereStyle('news')"
       (pointerdown)="onDragStart($event, 'news')"
       (click)="$event.stopPropagation()"
     >
       <app-news
         [isFullView]="activeTab === 'news'"
         (onSelect)="setActiveTab('news')"
       ></app-news>
     </div>
     <div
      #sphereRef
       class="sphere-wrapper"
      data-tab="recent"
       [class.is-active]="activeTab === 'recent'"
       [class.is-hidden]="isHidden('recent')"
       [ngStyle]="getSphereStyle('recent')"
       (pointerdown)="onDragStart($event, 'recent')"
       (click)="$event.stopPropagation()"
     >
       <app-recent
         [isFullView]="activeTab === 'recent'"
         [items]="frequentExpenses"
         (onSelect)="setActiveTab('recent')"
         (onRepeat)="repeatFrequentExpense($event)"
       ></app-recent>
     </div>
   </div>
 </div>
