<section class="wallet-screen">
  <header class="wallet-header">
    <h2>Wallet</h2>
    <span class="wallet-status" [class.connected]="isConnected">{{ isConnected ? 'Connected' : 'Disconnected' }}</span>
  </header>

  <p class="wallet-subtitle">Secure your account and manage wallet access in one place.</p>

  <div class="wallet-card">
    <div class="wallet-card-title">Connection</div>
    <div class="wallet-card-value">{{ isConnected ? 'Wallet linked' : 'No wallet linked' }}</div>
    <button type="button" class="wallet-btn" (click)="toggleConnection()">
      {{ isConnected ? 'Disconnect wallet' : 'Connect wallet' }}
    </button>
  </div>
</section>
